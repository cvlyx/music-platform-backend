services:
  - type: web
    name: music-platform-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://music-platform-api-od0x.onrender.com
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: music-platform-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: music-platform-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: music-platform-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: music-platform-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: music-platform-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stderr

databases:
  - name: music-platform-db
    plan: free
